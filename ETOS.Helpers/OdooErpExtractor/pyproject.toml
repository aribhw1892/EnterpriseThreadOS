[project]
name = "etos-odoo-erp-extractor"
version = "0.1.0"
description = "XML-driven Odoo ERP PostgreSQL extractor for EnterpriseThreadOS import workflows"
requires-python = ">=3.11"
dependencies = [
    "etos-extract-common",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2.0",
]

[project.scripts]
odoo-erp-extract = "app.main:cli"

[tool.uv.sources]
etos-extract-common = { path = "../EtosExtractCommon", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
