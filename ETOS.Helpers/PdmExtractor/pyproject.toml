[project]
name = "etos-pdm-extractor"
version = "0.1.0"
description = "SolidWorks PDM XML-driven SQL extractor for EnterpriseThreadOS import workflows"
requires-python = ">=3.11"
dependencies = [
    "etos-extract-common",
    "pyodbc>=5.2.0",
]

[tool.uv.sources]
etos-extract-common = { path = "../EtosExtractCommon", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
pdm-extract = "app.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
